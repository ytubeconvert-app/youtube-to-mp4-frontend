#:schema node_modules/wrangler/config-schema.json
name = "youtube-to-mp4-frontend"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
[assets]
directory = "./dist"

[vars]
# Live Cloudflare Worker backend API
PUBLIC_API_URL = "https://backend.ytubeconvert.site"
# Content Security Policy allowed backend endpoint (applied in public/_headers and dist/_headers)
CSP_BACKEND_URL = "https://backend.ytubeconvert.site"
# PUBLIC_TURNSTILE_SITE_KEY = ""

